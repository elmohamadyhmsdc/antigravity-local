openapi: 3.1.0
info:
  title: Your Gallery Mobile API
  version: 1.0.0
  description: |
    Stateless GPU compute API used by the Your Gallery app (Flutter).
    The phone is the source of truth for ALL user data; this server keeps no
    user database. See docs/plans/2026-10-11-mobile-app-plan.md.

    Conventions
    - Transport: HTTPS with a self-signed certificate that the phone pins by
      SHA-256 fingerprint (from the pairing QR). `Authorization: Bearer <token>`
      on everything except /v1/health and /v1/pair/complete.
    - Human identity embeddings are512float32/base64; character CCIP identity embeddings are768float32/base64. They are never interchangeable.
    - Boxes are pixels of the *uploaded* image: {x, y, w, h}, top-left origin.
    - Errors: `{error: {code, message, retryable}}`. 503 `gpu_busy` carries
      `Retry-After`. 409 `missing_blobs` also carries `missing: [sha256...]`.
    - The server's blob store is an evictable cache. A 409 means "upload these
      and retry", never "the data is lost".
servers:
  - url: https://{host}:{port}
    variables:
      host: { default: 192.168.1.10 }
      port: { default: "8443" }
security:
  - bearer: []

paths:
  /v1/health:
    get:
      summary: Liveness and identity (no auth)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/capabilities:
    get:
      summary: What this server can do right now
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }

  /v1/resources:
    get:
      summary: PC resource telemetry (authenticated, read-only, cached for 5 seconds)
      description: |
        RAM includes recognised application processes and children. GPU-wide VRAM
        includes other applications; process VRAM is null when unavailable.
        Storage counts only server scratch metadata, never the desktop library.
        Admission thresholds are configured locally on the PC and are not hard
        allocation caps. This endpoint does not start models or change limits.
      responses:
        "200":
          description: Current measurements; unavailable measurements are null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceSnapshot" }
        "401":
          description: Pairing token required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/pair/complete:
    post:
      summary: Exchange the one-time code from the QR for a device token (no auth)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairRequest" }
      responses:
        "200":
          description: Paired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResponse" }
        "401":
          description: Wrong, expired or used code (`invalid_code`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many wrong codes; the code is burned (`pairing_locked`). Create a new one on the PC.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/blobs/{sha256}:
    parameters:
      - { name: sha256, in: path, required: true, schema: { $ref: "#/components/schemas/Sha256" } }
    head:
      summary: Does the server cache this blob? (also tells a resuming upload where to continue)
      responses:
        "200":
          description: Cached
          headers:
            Content-Length: { schema: { type: integer } }
        "404":
          description: Not cached; upload it
          headers:
            Upload-Offset:
              description: Bytes of a partial upload the server already holds (0 if none). Continue from here.
              schema: { type: integer }
    put:
      summary: Upload a blob, in one request or in resumable chunks. The complete body must hash to {sha256}.
      description: |
        Without `Content-Range` the body is the whole blob (any partial upload is restarted).
        With `Content-Range: bytes <start>-<end>/<total>` it is one chunk and `<start>` must equal
        the current `Upload-Offset` (see HEAD); the chunk that completes `<total>` bytes finishes
        the upload and the server verifies the SHA-256.
      parameters:
        - { name: Content-Range, in: header, required: false, schema: { type: string, pattern: "^bytes \\d+-\\d+/\\d+$" } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Stored and verified }
        "202":
          description: Chunk accepted, more expected
          headers:
            Upload-Offset: { schema: { type: integer } }
        "204": { description: Already cached (body ignored) }
        "400": { $ref: "#/components/responses/Error" }
        "408":
          description: No body bytes arrived for 30 s (`upload_stalled`, retryable); bytes received so far are kept, resume from `Upload-Offset`
          headers:
            Upload-Offset: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The chunk does not start where the server's partial upload ends (`offset_mismatch`); resume from `Upload-Offset`
          headers:
            Upload-Offset: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422":
          description: The bytes do not hash to {sha256} (`hash_mismatch`); the partial upload was discarded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/analyze/image:
    post:
      summary: Detect faces and bodies in one image
      description: Returns 503 gpu_busy while a heavy job is running.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                options: { $ref: "#/components/schemas/AnalyzeImageOptions" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeImageResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/analyze/outlines:
    post:
      summary: Compute outlines for known face and body bounding boxes
      description: Returns 503 gpu_busy while a heavy job is running.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, targets]
              properties:
                image: { type: string, format: binary }
                targets:
                  type: array
                  maxItems: 32
                  items: { $ref: "#/components/schemas/OutlineTarget" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeOutlinesResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/analyze/marks:
    post:
      summary: Match a marked tattoo patch against candidate skin patches (OpenCV, no model)
      description: |
        AKAZE features, ratio test and a RANSAC homography. Each candidate is tried straight and mirrored (mirror
        selfies); the phone sends the opposite body segment as its own candidate. Nothing is stored. The answer is
        evidence: a match is a SUGGESTION until the Phase 0 evaluation shows precision.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [reference, candidates]
              properties:
                reference: { type: string, format: binary }
                candidates:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeMarksResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /v1/analyze/sensitive:
    post:
      summary: Exposed / covered body-part regions for a photo scanned before `return_sensitive` existed
      description: |
        Same regions as `AnalyzeImageOptions.return_sensitive`, for a photo the phone already
        analysed. `bodies` are the phone's stored boxes in image pixels (and keypoints, which decide
        which body a region belongs to). Nothing is stored. 409 `model_missing` when the model is
        not installed on the PC; 503 gpu_busy while a heavy job runs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                bodies:
                  type: array
                  maxItems: 64
                  items: { $ref: "#/components/schemas/SensitiveBodyTarget" }
                embeddings:
                  type: boolean
                  default: false
                  description: "Also return `bodies` with the chest / lower-body embeddings and morphology of each target (roadmap 7.5). 409 `model_missing` without the DINOv2 model."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeSensitiveResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/analyze/garments:
    post:
      summary: Raw garment-tag scores (WD14) for the bodies of a photo (roadmap Phase 7)
      description: |
        Evidence for the user's own labelling, not a filter: the tagger is anime-trained and no tag has a
        measured precision on real photos yet. `bodies` are the phone's stored boxes in image pixels (the
        same `SensitiveBodyTarget` as /v1/analyze/sensitive; keypoints are ignored). Nothing is stored.
        One entry per requested body, in order; a body too small to tag has an empty list. 409
        `model_missing` without the tagger; 503 gpu_busy while a heavy job runs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                bodies:
                  type: array
                  maxItems: 64
                  items: { $ref: "#/components/schemas/SensitiveBodyTarget" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyzeGarmentsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/analyze/equipment:
    post:
      summary: Detect equipment near people and suggest an associated person
      description: |
        Local Florence object detection; nothing is stored on the PC. Association by
        proximity is an editable suggestion, not proof that a person uses an object.
        bodies is a JSON-encoded list of pixel boxes and optional keypoints.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                bodies:
                  type: array
                  maxItems: 64
                  items: { $ref: '#/components/schemas/SensitiveBodyTarget' }
      responses:
        '200':
          description: Equipment suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/analyze/targeted:
    post:
      summary: On-demand targeted detection for bodies, areas, faces, and objects
      description: |
        High-accuracy / native-resolution detection for a specific target kind.
        Returns precise bboxes and optional outlines or keypoints.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, target_kind]
              properties:
                image: { type: string, format: binary }
                target_kind:
                  type: string
                  enum: [area, body, face, object]
                roi:
                  type: string
                  description: Optional JSON-encoded ROI {x, y, w, h}
                prompt:
                  type: string
                  description: Optional prompt for text-grounded objects
                high_res:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Targeted detections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetedAnalysisResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/actions/match:
    post:
      summary: Stateless CPU ranking of sampled photo configurations or video pose sequences
      description: Both identity kinds use the same geometry. Names, identities and confirmation stay on the phone. At most64 candidates and20 samples each;16MiB compressed/inflated body caps. Scores are not probabilities or semantic classifications.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionMatchRequest" }
      responses:
        "200":
          description: One comparison per opaque candidate ID; null when not comparable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionMatchResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /v1/grouping/plan:
    post:
      summary: Pure function - decide how faces/bodies should be grouped
      description: |
        Nothing is stored. `mode: apply` mirrors group_library (only confident
        decisions); `mode: review` mirrors review_state (everything the Review
        screen shows). The phone applies the result in one transaction.

        Served by grouping_core.plan_request - the same DB-free code the PC's own
        gallery runs on - on the CPU, so it never answers `gpu_busy`.

        The body may be sent with `Content-Encoding: gzip` (a first scan is several
        MB of base64 embeddings) and the answer is gzipped when `Accept-Encoding`
        allows it. Both the compressed and the inflated size are capped by the
        server (413 `too_large`).

        The phone orchestrates rounds so ids stay real: round 1 `apply` with
        [match, cluster] -> apply the autos in one transaction (new people get real
        ids) -> round 2 `apply` with [bodies] (derived body links cleared first) ->
        round 3 `review` with all four stages -> store the suggestions. In `apply`
        mode `body_links` also carries the `suggest` links; the caller applies only
        `auto` ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupingPlanRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupingPlanResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /v1/jobs:
    post:
      summary: Queue a GPU job
      description: "Implements analyze_video, Reface, clothing restyle and character LoRA dataset/train/generate jobs. Studio requests are limited to 512 KB, require client_job_id and queue behind active GPU work. Jobs and input snapshots are private to their paired device."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreate" }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "409":
          description: Some input blobs are not cached; upload them and retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingBlobsError" }
    get:
      summary: Status of several jobs (re-sync after reconnecting)
      parameters:
        - { name: ids, in: query, required: false, schema: { type: string }, description: "Up to 32 comma-separated job ids; omitted lists this device's jobs. Any unknown or unowned id returns 404." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/JobStatus" }
                  unknown_ids:
                    type: array
                    items: { type: string }
                    description: Ids the server no longer has (purged after ACK/TTL)

  /v1/jobs/{job_id}:
    parameters:
      - { name: job_id, in: path, required: true, schema: { type: string } }
    get:
      summary: One job
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: ACK the results and purge job files and unshared input cache copies
      responses:
        "204": { description: Purged }

  /v1/jobs/{job_id}/events:
    parameters:
      - { name: job_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Server-sent events, one JobStatus JSON per `data:` line
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /v1/jobs/{job_id}/stop:
    parameters:
      - { name: job_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Pause a queued job or request pause at the next video checkpoint
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }

  /v1/jobs/{job_id}/resume:
    parameters:
      - { name: job_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Re-queue a paused job (failed jobs must be removed and submitted again)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }

  /v1/jobs/{job_id}/result:
    parameters:
      - { name: job_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Manifest of the files a finished (or partially finished) job produced
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultManifest" }

  /v1/jobs/{job_id}/frames:
    parameters:
      - { name: job_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Verified bounded batches of committed video frames, available while scanning
      parameters:
        - { name: cursor, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 8, default: 8 } }
      responses:
        "200":
          description: Complete NDJSON records; advance the cursor only after committing all records locally
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoFrameBatch" }

  /v1/jobs/{job_id}/result/{name}:
    parameters:
      - { name: job_id, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      summary: Download one result file (supports Range)
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Partial content }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------------------------------------------------------------- basics
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"

    Embedding:
      type: string
      description: 512 x float32 little-endian, base64
      minLength: 2732
      maxLength: 2732
      pattern: "^[A-Za-z0-9+/]{2731}=$"

    Base64Jpeg:
      type: string
      description: base64 JPEG bytes

    Appearance:
      type: array
      description: 2 regions (torso, legs) x 40 Hellinger-form histogram bins
      minItems: 80
      maxItems: 80
      items: { type: number }

    BBox:
      type: object
      required: [x, y, w, h]
      properties:
        x: { type: number }
        y: { type: number }
        w: { type: number, exclusiveMinimum: 0 }
        h: { type: number, exclusiveMinimum: 0 }

    Pose:
      type: object
      required: [yaw, pitch]
      properties:
        yaw: { type: number }
        pitch: { type: number }
        roll: { type: [number, "null"] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              examples: [gpu_busy, unauthorized, missing_blobs, bad_request, bad_image, model_mismatch, not_found, internal,
                         offset_mismatch, upload_stalled, hash_mismatch, too_large, invalid_code, pairing_locked]
            message: { type: string }
            retryable: { type: boolean }

    MissingBlobsError:
      type: object
      required: [error, missing]
      properties:
        error: { $ref: "#/components/schemas/Error/properties/error" }
        missing:
          type: array
          items: { $ref: "#/components/schemas/Sha256" }

    # ---------------------------------------------------------------- system
    Health:
      type: object
      required: [status, server_id, name, api_version]
      properties:
        status: { type: string, const: ok }
        server_id: { type: string }
        name: { type: string }
        api_version: { type: string }

    OperationSupport:
      type: object
      required: [operation, kind, media_types, available, engine, identity_models, reason]
      properties:
        experimental: { type: boolean, default: false, description: Default-off execution path requiring explicit client/operator opt-in. }
        operation: { type: string }
        kind: { type: string, enum: [person, character] }
        media_types:
          type: array
          items: { type: string, enum: [photo, video, dataset, model] }
        available: { type: boolean }
        engine: { type: string }
        identity_models:
          type: array
          items: { type: string }
        reason: { type: [string, "null"] }

    CharacterEmbedding:
      type: string
      description: 768 finite unit float32 values, little-endian/base64, CCIP identity space.
      minLength: 4096
      maxLength: 4096

    Capabilities:
      type: object
      required: [api_version, server_id, name, embedding_model, gpu, engines, restorers, lora_base_checkpoints, limits, busy]
      properties:
        api_version: { type: string }
        server_id: { type: string }
        name: { type: string }
        operations:
          type: array
          description: Model-aware installed execution paths. Omission means legacy/unknown; availability does not certify output quality.
          items: { $ref: "#/components/schemas/OperationSupport" }
        embedding_model:
          type: object
          required: [id, dim]
          properties:
            id: { type: string, examples: ["buffalo_l@1"] }
            dim: { type: integer, const: 512 }
        gpu:
          type: [object, "null"]
          required: [name, vram_total_mb, vram_free_mb]
          properties:
            name: { type: string }
            vram_total_mb: { type: integer }
            vram_free_mb: { type: integer }
        engines:
          type: object
          required: [reface_v3, reface_v2, dfm_models, undress, lora_train, lora_generate, body_detection]
          properties:
            reface:
              type: boolean
              description: Unified Reface image/video jobs and quality profiles are supported.
            reface_v3: { type: boolean, deprecated: true, description: "Readiness for legacy *_v3 job aliases." }
            reface_v2: { type: boolean, deprecated: true, description: "Readiness for legacy *_v2 job aliases." }
            identity_bundle: { type: boolean }
            reface_geometry: { type: boolean }
            dfm_models:
              type: array
              items: { type: string }
            undress: { type: boolean }
            photo_edit:
              type: boolean
              default: false
              description: Masked still-photo background/object editing, with person protection and checked outputs.
            restyle_refine:
              type: boolean
              description: Optional SDXL refinement readiness, independently of basic Restyle. Older servers omit this field.
            lora_train: { type: boolean }
            lora_generate: { type: boolean }
            body_detection: { type: boolean }
            character_detection: { type: boolean, default: false }
            sensitive_detection:
              type: boolean
              default: false
              description: The NudeNet model is installed, so `return_sensitive` and /v1/analyze/sensitive work. Older servers omit this field.
            body_embeddings:
              type: boolean
              default: false
              description: The DINOv2 model is installed next to the NudeNet one, so `return_body_embeddings` works. Older servers omit this field.
            equipment:
              type: boolean
              default: false
              description: A local Florence worker and model are installed for equipment recognition.
            garment_tags:
              type: boolean
              default: false
              description: The WD14 tagger is installed, so /v1/analyze/garments works. Older servers omit this field.
        restorers:
          type: array
          items: { type: string }
        reface_profiles:
          type: object
          description: Automatic settings for the same Reface pipeline, based on installed models.
          additionalProperties:
            type: object
            required: [restorer, restore_size, use_parser]
            properties:
              restorer: { type: string }
              restore_size: { type: integer, enum: [512, 1024] }
              use_parser: { type: boolean }
              photo_ms_per_face:
                type: number
                description: Typical milliseconds this PC needs to swap one normal-size face in a photo with this profile. Optional; older servers omit it.
              video_ms_per_face:
                type: number
                description: The same for one face in one video frame (frames overlap, so it is cheaper than in a photo).
        lora_base_checkpoints:
          type: array
          items: { type: string }
        limits:
          type: object
          required: [max_image_px, max_upload_mb, blob_cache_mb]
          properties:
            max_image_px: { type: integer }
            max_upload_mb: { type: integer }
            blob_cache_mb: { type: integer }
        busy:
          type: [object, "null"]
          required: [job_id, job_type, source]
          properties:
            job_id: { type: string }
            job_type: { type: string }
            source:
              type: string
              enum: [mobile, dashboard]

    ResourceSnapshot:
      type: object
      required: [sampled_at, ram, app_ram_bytes, processes_complete, processes, gpus, disk, app_storage_bytes, storage_complete, storage_sampled_at, warnings, alerts, admission_blocked, admission_reasons, storage_scope]
      properties:
        sampled_at: { type: string, format: date-time }
        ram:
          type: [object, "null"]
          required: [total_bytes, available_bytes, used_percent]
          properties:
            total_bytes: { type: integer, minimum: 0 }
            available_bytes: { type: integer, minimum: 0 }
            used_percent: { type: number, minimum: 0, maximum: 100 }
        app_ram_bytes: { type: [integer, "null"], minimum: 0 }
        processes_complete: { type: boolean }
        processes:
          type: array
          items:
            type: object
            required: [pid, name, ram_bytes]
            properties:
              pid: { type: integer }
              name: { type: string }
              ram_bytes: { type: integer, minimum: 0 }
        gpus:
          type: array
          items:
            type: object
            required: [index, uuid, name, total_bytes, used_bytes, free_bytes, utilization_percent, temperature_c, app_used_bytes]
            properties:
              index: { type: integer, minimum: 0 }
              uuid: { type: string }
              name: { type: string }
              total_bytes: { type: integer, minimum: 0 }
              used_bytes: { type: integer, minimum: 0 }
              free_bytes: { type: integer, minimum: 0 }
              utilization_percent: { type: [number, "null"] }
              temperature_c: { type: [number, "null"] }
              app_used_bytes: { type: [integer, "null"], minimum: 0 }
        disk:
          type: [object, "null"]
          required: [total_bytes, used_bytes, free_bytes]
          properties:
            total_bytes: { type: integer, minimum: 0 }
            used_bytes: { type: integer, minimum: 0 }
            free_bytes: { type: integer, minimum: 0 }
        app_storage_bytes: { type: integer, minimum: 0 }
        storage_complete: { type: boolean }
        storage_sampled_at: { type: [string, "null"], format: date-time }
        storage_scope: { type: string, const: server_scratch }
        warnings: { type: array, items: { type: string } }
        alerts: { type: array, items: { type: string } }
        admission_blocked: { type: boolean }
        admission_reasons: { type: array, items: { type: string } }

    PairRequest:
      type: object
      required: [code, device_name]
      properties:
        code: { type: string }
        device_name: { type: string }

    PairResponse:
      type: object
      required: [token, server_id, server_name]
      properties:
        token: { type: string }
        server_id: { type: string }
        server_name: { type: string }

    # --------------------------------------------------------------- analyze
    AnalyzeImageOptions:
      type: object
      properties:
        detect_bodies: { type: boolean, default: true }
        detect_characters:
          type: boolean
          default: false
          description: Illustrated-source mode. Uses HumanArt body detections and character appearance instead of human face/body identity. No face model is required.
        min_quality: { type: number, default: 0.40 }
        return_crops: { type: boolean, default: true }
        body_score: { type: number, default: 0.5 }
        model_id:
          type: string
          description: The embedding model the phone's library uses; the server answers 409 `model_mismatch` if it differs
        return_outlines:
          type: boolean
          default: false
          description: "ask for face/body polygons; costs one parser pass per stored face and one RMBG pass per body"
        faceless_characters:
          type: boolean
          default: true
          description: "With detect_characters: a body without a face, in a frame without real faces, is a character. False (a photo the user did not mark illustrated): only next to drawn faces."
        force_kind:
          type: [string, "null"]
          enum: [person, character, null]
          description: "The user's correction for the whole file: every detection is a person (drawn-face filter off) or a character."
        kind_overrides:
          type: array
          maxItems: 4096
          description: "The user's corrections of single detections; they win over force_kind."
          items: { $ref: "#/components/schemas/KindOverride" }
        return_sensitive:
          type: boolean
          default: false
          description: "Also return `sensitive_regions` (NudeNet boxes, roadmap section 8). Off: the response is unchanged. 409 `model_missing` when the model is not installed."
        return_body_embeddings:
          type: boolean
          default: false
          description: "Roadmap 7.5 (Phase 8): also return chest_embedding, buttocks_embedding and morphology on the bodies that have exposed regions (implies the regions are computed). 409 `model_missing` when the DINOv2 model is not installed."

    SensitiveRegion:
      type: object
      required: [label, exposed, score, bbox, body_index]
      properties:
        label:
          type: string
          description: "NudeNet v3 label, e.g. FEMALE_BREAST_EXPOSED, BELLY_COVERED (face labels are never returned)"
        exposed: { type: boolean, description: "label ends with _EXPOSED" }
        score: { type: number, minimum: 0, maximum: 1 }
        bbox: { $ref: "#/components/schemas/BBox" }
        body_index:
          type: [integer, "null"]
          minimum: 0
          description: "Index into `bodies` of the body this region belongs to; null when no body fits"
        character_index:
          type: integer
          minimum: 0
          description: "Present when the region belongs to a drawn character's body: index into `characters` (then `body_index` is null). Characters get the same regions as people."

    MarkMatch:
      type: object
      required: [index, inliers, matches, inlier_ratio, mirrored]
      properties:
        index: { type: integer, minimum: 0, description: "Position of the candidate in the request" }
        inliers: { type: integer, minimum: 0 }
        matches: { type: integer, minimum: 0 }
        inlier_ratio: { type: number, minimum: 0, maximum: 1 }
        mirrored: { type: boolean, description: "The flipped candidate matched better (a mirror selfie)" }

    AnalyzeMarksResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/MarkMatch" }

    BodyEmbeddings:
      type: object
      required: [chest_embedding, buttocks_embedding, morphology]
      properties:
        chest_embedding:
          oneOf: [{ $ref: "#/components/schemas/PatchEmbedding" }, { type: "null" }]
        buttocks_embedding:
          oneOf: [{ $ref: "#/components/schemas/PatchEmbedding" }, { type: "null" }]
        morphology:
          oneOf: [{ $ref: "#/components/schemas/BodyMorphology" }, { type: "null" }]

    SensitiveBodyTarget:
      type: object
      required: [bbox]
      properties:
        bbox: { $ref: "#/components/schemas/BBox" }
        kpts:
          description: 17 COCO keypoints as [x, y, score] in image pixels
          type: [array, "null"]
          minItems: 17
          maxItems: 17
          items: { type: array, minItems: 3, maxItems: 3, items: { type: number } }

    AnalyzeSensitiveResponse:
      type: object
      required: [model_version, regions]
      properties:
        bodies:
          type: array
          description: "Only with `embeddings`: one entry per requested body, in order"
          items: { $ref: "#/components/schemas/BodyEmbeddings" }
        model_version: { type: integer, description: "Bumped when the model or decode changes; the phone rescans older rows" }
        regions:
          type: array
          items: { $ref: "#/components/schemas/SensitiveRegion" }

    GarmentTag:
      type: object
      required: [tag, category, score]
      properties:
        tag: { type: string, maxLength: 64 }
        category: { type: string, enum: [upper, outerwear, lower, full_body, pattern, accessory, footwear] }
        score: { type: number, minimum: 0, maximum: 1 }

    AnalyzeGarmentsResponse:
      type: object
      required: [model_version, bodies]
      properties:
        model_version: { type: integer, description: "Bumped when the vocabulary or crop changes; the phone re-asks older rows" }
        bodies:
          type: array
          maxItems: 64
          items:
            type: object
            required: [tags]
            properties:
              tags:
                type: array
                maxItems: 24
                items: { $ref: "#/components/schemas/GarmentTag" }

    EquipmentResponse:
      type: object
      required: [model_version, objects]
      properties:
        model_version: { type: integer, minimum: 1 }
        objects:
          type: array
          maxItems: 100
          items:
            type: object
            required: [object_key, label, body_index, bbox]
            properties:
              object_key: { type: string }
              label: { type: string, minLength: 1, maxLength: 80 }
              body_index: { type: [integer, 'null'], minimum: 0, maximum: 63 }
              bbox:
                type: object
                description: Normalized coordinates in the uploaded image
                required: [x, y, w, h]
                properties:
                  x: { type: number, minimum: 0, maximum: 1 }
                  y: { type: number, minimum: 0, maximum: 1 }
                  w: { type: number, exclusiveMinimum: 0, maximum: 1 }
                  h: { type: number, exclusiveMinimum: 0, maximum: 1 }

    TargetedDetectionItem:
      type: object
      required: [bbox, score, label]
      properties:
        bbox: { $ref: "#/components/schemas/BBox" }
        score: { type: number, minimum: 0, maximum: 1 }
        label: { type: string }
        outline:
          description: Contour coordinates as list of [x, y] points
          type: [array, "null"]
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        keypoints:
          description: Keypoints as list of [x, y, score] triples
          type: [array, "null"]
          items:
            type: array
            minItems: 3
            maxItems: 3
            items: { type: number }

    TargetedAnalysisResponse:
      type: object
      required: [target_kind, detections]
      properties:
        target_kind:
          type: string
          enum: [area, body, face, object]
        detections:
          type: array
          items: { $ref: "#/components/schemas/TargetedDetectionItem" }

    KindOverride:
      type: object
      required: [kind, part, box]
      properties:
        kind: { type: string, enum: [person, character] }
        part:
          type: string
          enum: [face, body]
          description: "face: matches a human or anime face box (IoU or containment); body: a body box at IoU >= 0.5"
        box:
          type: array
          description: "[x, y, w, h] normalised to 0..1 of the image"
          minItems: 4
          maxItems: 4
          items: { type: number, minimum: 0, maximum: 1 }
        timestamp_ms:
          type: [integer, "null"]
          minimum: 0
          description: "Videos: the correction applies to samples within half a sampling step (at least 250 ms) of this time"

    FaceQuality:
      type: object
      description: Output of face_quality.assess (quality v2)
      required: [quality_score, quality_version, quality_parts, det_score, face_px, sharpness, embedding_norm, pose]
      properties:
        quality_score: { type: number, minimum: 0, maximum: 1 }
        quality_version: { type: integer }
        quality_parts:
          type: object
          required: [norm, size, sharp, pose]
          properties:
            norm: { type: number }
            size: { type: number }
            sharp: { type: number }
            pose: { type: number }
        det_score: { type: number }
        face_px: { type: number }
        sharpness: { type: number }
        embedding_norm: { type: [number, "null"] }
        pose:
          oneOf:
            - { $ref: "#/components/schemas/Pose" }
            - { type: "null" }

    Face:
      type: object
      required: [bbox, kps, det_score, embedding, quality, passes_gate]
      properties:
        bbox: { $ref: "#/components/schemas/BBox" }
        kps:
          type: array
          description: 5 landmarks (eyes, nose, mouth corners) as [x, y]
          minItems: 5
          maxItems: 5
          items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
        det_score: { type: number }
        embedding: { $ref: "#/components/schemas/Embedding" }
        quality: { $ref: "#/components/schemas/FaceQuality" }
        passes_gate:
          type: boolean
          description: Meets det_score, size and min_quality; the phone stores only these as gallery faces
        forced:
          type: boolean
          description: "Present (true) when the user said this face is a person: never treat it as a drawing"
        crop_jpeg:
          oneOf:
            - { $ref: "#/components/schemas/Base64Jpeg" }
            - { type: "null" }
        outline:
          description: Polygon around the real face/body shape, image pixels, 3-64 [x, y] points, not closed. Null when unavailable.
          oneOf:
            - { type: array, minItems: 3, maxItems: 64, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } }
            - { type: "null" }

    Body:
      type: object
      required: [bbox, score]
      properties:
        bbox: { $ref: "#/components/schemas/BBox" }
        score: { type: number }
        kpts:
          description: 17 COCO keypoints as [x, y, score]
          oneOf:
            - { type: array, minItems: 17, maxItems: 17, items: { type: array, minItems: 3, maxItems: 3, items: { type: number } } }
            - { type: "null" }
        appearance:
          description: 80-float outfit descriptor (torso + legs HSV histograms; person_linking.appearance_descriptor)
          oneOf:
            - { $ref: "#/components/schemas/Appearance" }
            - { type: "null" }
        extent:
          type: [string, "null"]
        crop_jpeg:
          oneOf:
            - { $ref: "#/components/schemas/Base64Jpeg" }
            - { type: "null" }
        outline:
          description: Polygon around the real face/body shape, image pixels, 3-64 [x, y] points, not closed. Null when unavailable.
          oneOf:
            - { type: array, minItems: 3, maxItems: 64, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } }
            - { type: "null" }
        chest_embedding:
          description: "Only with `return_body_embeddings`. DINOv2 ViT-S/14 of the exposed chest / torso patch; null when the body has none."
          oneOf:
            - { $ref: "#/components/schemas/PatchEmbedding" }
            - { type: "null" }
        buttocks_embedding:
          description: "Only with `return_body_embeddings`. DINOv2 ViT-S/14 of the exposed lower-body patch; null when the body has none."
          oneOf:
            - { $ref: "#/components/schemas/PatchEmbedding" }
            - { type: "null" }
        morphology:
          description: "Only with `return_body_embeddings`."
          oneOf:
            - { $ref: "#/components/schemas/BodyMorphology" }
            - { type: "null" }

    PatchEmbedding:
      type: string
      description: 384 x float32 little-endian (unit length), base64
      minLength: 2048
      maxLength: 2048
      pattern: "^[A-Za-z0-9+/]{2048}$"

    BodyMorphology:
      type: object
      description: |
        Measurable descriptors of the exposed regions. Ratios are normalised by the shoulder width (chest) or hip
        width (lower body) when those keypoints are visible (`scale_source: kpts`), else by the body box width
        (`bbox`); the phone compares ratios only between bodies of the same `scale_source`.
      required: [scale_source]
      properties:
        scale_source: { type: string, enum: [kpts, bbox] }
        lower_scale_source: { type: string, enum: [kpts, bbox] }
        breast_span_ratio: { type: number }
        areola_contrast: { type: [number, "null"] }
        buttocks_span_ratio: { type: number }
        hip_waist_ratio: { type: [number, "null"] }
        skin_tone_lab:
          type: [array, "null"]
          minItems: 3
          maxItems: 3
          items: { type: number }
        micro_marks:
          type: array
          description: "Dark spots on bare skin as [dx, dy, strength] from the shoulder / hip middle in units of the scale"
          items: { type: array, minItems: 3, maxItems: 3, items: { type: number } }

    FaceBodyPair:
      type: object
      required: [face_index, body_index, score]
      properties:
        face_index: { type: integer, minimum: 0 }
        body_index: { type: integer, minimum: 0 }
        score: { type: number }

    Character:
      type: object
      required: [bbox, score, model_id, descriptor]
      properties:
        bbox: { $ref: "#/components/schemas/BBox" }
        score: { type: number, minimum: 0, maximum: 1 }
        model_id: { type: string, enum: ["character-appearance@1"] }
        descriptor:
          type: array
          minItems: 160
          maxItems: 160
          items: { type: number, minimum: 0, maximum: 1 }
          description: Versioned head/hair, upper/lower clothing, edge detail and silhouette descriptor; never an ArcFace embedding.
        crop_jpeg:
          oneOf:
            - { $ref: "#/components/schemas/Base64Jpeg" }
            - { type: "null" }
        face:
          description: The drawn face, when the anime face detector found one. Optional, so older servers stay valid.
          oneOf:
            - { $ref: "#/components/schemas/CharacterFace" }
            - { type: "null" }
        body:
          description: The body of the figure, when the body detector found one.
          oneOf:
            - { $ref: "#/components/schemas/CharacterBody" }
            - { type: "null" }

    CharacterFace:
      type: object
      required: [bbox, score, embedding_model_id, embedding]
      properties:
        bbox: { $ref: "#/components/schemas/BBox" }
        score: { type: number, minimum: 0, maximum: 1 }
        embedding_model_id: { type: string, enum: ["ccip-caformer24@1"] }
        embedding:
          description: 768 x float32 little-endian, unit length (CCIP). Null when the CCIP model is not installed.
          oneOf:
            - { type: string, minLength: 4096, maxLength: 4096 }
            - { type: "null" }
        crop_jpeg:
          oneOf:
            - { $ref: "#/components/schemas/Base64Jpeg" }
            - { type: "null" }

    CharacterBody:
      type: object
      required: [bbox, score]
      properties:
        bbox: { $ref: "#/components/schemas/BBox" }
        score: { type: number, minimum: 0, maximum: 1 }
        kpts:
          description: 17 COCO keypoints as [x, y, score], or null
          type: [array, "null"]
        appearance:
          description: Outfit descriptor, the same one people bodies carry
          type: [array, "null"]
          items: { type: number }
        extent:
          type: [string, "null"]
          enum: [full, knee, upper, head, null]
          description: How much of the figure is visible, from its keypoints (as for people)
        outline:
          description: Silhouette in image pixels, as for people (only with return_outlines)
          oneOf:
            - { type: array, minItems: 3, maxItems: 64, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } }
            - { type: "null" }
        crop_jpeg:
          oneOf:
            - { $ref: "#/components/schemas/Base64Jpeg" }
            - { type: "null" }
        chest_embedding:
          description: "Only with `return_body_embeddings`, exactly as on people bodies."
          oneOf:
            - { $ref: "#/components/schemas/PatchEmbedding" }
            - { type: "null" }
        buttocks_embedding:
          oneOf:
            - { $ref: "#/components/schemas/PatchEmbedding" }
            - { type: "null" }
        morphology:
          oneOf:
            - { $ref: "#/components/schemas/BodyMorphology" }
            - { type: "null" }

    AnalyzeImageResponse:
      type: object
      required: [model_id, image_w, image_h, faces, bodies, pairs]
      properties:
        model_id: { type: string, examples: ["buffalo_l@1"] }
        image_w: { type: integer }
        image_h: { type: integer }
        faces:
          type: array
          items: { $ref: "#/components/schemas/Face" }
        bodies:
          type: array
          items: { $ref: "#/components/schemas/Body" }
        characters:
          type: array
          default: []
          items: { $ref: "#/components/schemas/Character" }
        pairs:
          type: array
          items: { $ref: "#/components/schemas/FaceBodyPair" }
        sensitive_regions:
          type: array
          description: "Only with `return_sensitive: true`"
          items: { $ref: "#/components/schemas/SensitiveRegion" }
        timings_ms:
          type: object
          additionalProperties: { type: number }

    OutlineTarget:
      type: object
      required: [kind, bbox]
      properties:
        kind:
          type: string
          enum: [f, b]
        bbox: { $ref: "#/components/schemas/BBox" }
        kps:
          description: 5 landmarks (eyes, nose, mouth corners) as [x, y]
          type: [array, "null"]
          minItems: 5
          maxItems: 5
          items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
        kpts:
          description: 17 COCO keypoints as [x, y, score]
          type: [array, "null"]
          minItems: 17
          maxItems: 17
          items: { type: array, minItems: 3, maxItems: 3, items: { type: number } }

    AnalyzeOutlinesResponse:
      type: object
      required: [outlines]
      properties:
        outlines:
          type: array
          items:
            description: Polygon around the real face/body shape, image pixels, 3-64 [x, y] points, not closed. Null when unavailable.
            oneOf:
              - { type: array, minItems: 3, maxItems: 64, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } }
              - { type: "null" }

    # -------------------------------------------------------------- grouping
    IdentityEmbedding:
      oneOf:
        - { $ref: "#/components/schemas/Embedding" }
        - { $ref: "#/components/schemas/CharacterEmbedding" }

    GroupingModel:
      type: object
      description: |
        One person. `proto` is the quality-weighted (q^2) mean of ALL the person's
        face embeddings; `members` are the best-quality faces first (capped).
        Duplicate-person scoring reads the first 50 members, so keep cap >= 50.
        The server accepts 1..1000 members per person and does not re-normalise
        `proto`/`members` (send unit vectors). The phone's cap is
        `groupingMemberCap` in lib/domain/grouping/grouping_config.dart (the PC's
        own gallery uses 300; eval_member_cap.py measures the smaller values).
      required: [pid, proto, members, count]
      properties:
        pid: { type: integer }
        proto: { $ref: "#/components/schemas/IdentityEmbedding" }
        members:
          type: array
          items: { $ref: "#/components/schemas/IdentityEmbedding" }
        count: { type: integer, minimum: 1 }

    GroupingFace:
      type: object
      required: [id, embedding, quality, frame_key, rejected_person_ids]
      properties:
        id: { type: integer }
        embedding: { $ref: "#/components/schemas/IdentityEmbedding" }
        quality: { type: number }
        frame_key:
          type: [string, "null"]
          description: Faces sharing a key are in the same photo/frame and cannot be one person
        rejected_person_ids:
          type: array
          items: { type: integer }

    GroupingBody:
      type: object
      required: [id, media_id, frame_number, anchor_person_id, appearance, rejected_person_ids]
      properties:
        id: { type: integer }
        media_id: { type: [integer, "null"] }
        frame_number: { type: [integer, "null"] }
        anchor_person_id:
          type: [integer, "null"]
          description: |
            Person it already belongs to through its face or a link made by hand.
            Round 2 (`apply`, bodies) sends derived (appearance / weak_face) links as
            null because they are being re-derived; `review` sends every current link,
            exactly like the PC's review_state.
        appearance:
          oneOf:
            - { $ref: "#/components/schemas/Appearance" }
            - { type: "null" }
        weak_face_embedding:
          oneOf:
            - { $ref: "#/components/schemas/IdentityEmbedding" }
            - { type: "null" }
        rejected_person_ids:
          type: array
          items: { type: integer }
        taken_at:
          type: [integer, "null"]
          description: |
            Epoch milliseconds of the photo, for event-context linking: a faceless body whose outfit
            matches an identified body of another photo taken within the window (`event_outfit`).
            Omitted / null = unknown; such bodies are never matched by time.

    GroupingPlanRequest:
      type: object
      required: [mode, stages, strictness, models, pending, distinct_pairs, bodies]
      properties:
        mode:
          type: string
          enum: [apply, review]
        stages:
          type: array
          description: apply supports match, cluster, bodies; review supports all four
          items: { type: string, enum: [match, cluster, duplicates, bodies] }
          uniqueItems: true
        strictness: { type: string, enum: [strict, balanced, loose, character], description: "character = drawn characters: embeddings are CCIP (768 floats), not ArcFace (512)" }
        models:
          type: array
          items: { $ref: "#/components/schemas/GroupingModel" }
        pending:
          type: array
          description: Faces with no person yet
          items: { $ref: "#/components/schemas/GroupingFace" }
        dismissed_face_ids:
          type: array
          description: Manually hidden faces, excluded from matching and clustering in both apply and review modes.
          items: { type: integer }
        distinct_pairs:
          type: array
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }
        bodies:
          type: array
          items: { $ref: "#/components/schemas/GroupingBody" }
        max_suggestions_per_person: { type: integer, default: 60 }
        link_alike_people:
          type: boolean
          default: false
          description: >-
            Treat known people who are almost certainly one real person (person-pair score at or above the
            strictness profile's merge_auto, and not in distinct_pairs) as one when matching: they do not
            count as each other's runner-up, and in apply mode a freshly clustered group that clearly is a
            known person comes back as auto assignments to them instead of a new group.

      allOf:
        - if: { properties: { strictness: { const: character } } }
          then:
            properties:
              models:
                items:
                  properties:
                    proto: { $ref: "#/components/schemas/CharacterEmbedding" }
                    members: { items: { $ref: "#/components/schemas/CharacterEmbedding" } }
              pending: { items: { properties: { embedding: { $ref: "#/components/schemas/CharacterEmbedding" } } } }
              bodies: { items: { properties: { weak_face_embedding: { oneOf: [ { $ref: "#/components/schemas/CharacterEmbedding" }, { type: "null" } ] } } } }
          else:
            properties:
              models:
                items:
                  properties:
                    proto: { $ref: "#/components/schemas/Embedding" }
                    members: { items: { $ref: "#/components/schemas/Embedding" } }
              pending: { items: { properties: { embedding: { $ref: "#/components/schemas/Embedding" } } } }
              bodies: { items: { properties: { weak_face_embedding: { oneOf: [ { $ref: "#/components/schemas/Embedding" }, { type: "null" } ] } } } }

    FaceAssignment:
      type: object
      required: [face_id, person_id, score, margin, decision]
      properties:
        face_id: { type: integer }
        person_id: { type: integer }
        score: { type: number }
        margin: { type: number }
        decision: { type: string, enum: [auto, suggest] }

    FaceGroup:
      type: object
      required: [face_ids, cohesion, quality, auto_create]
      properties:
        face_ids:
          type: array
          items: { type: integer }
        cohesion: { type: number }
        quality: { type: number }
        auto_create:
          type: boolean
          description: Big and cohesive enough that apply mode makes a person from it

    DuplicatePeople:
      type: object
      required: [person_a, person_b, score]
      properties:
        person_a: { type: integer }
        person_b: { type: integer }
        score: { type: number }

    BodyLink:
      type: object
      required: [body_id, person_id, method, confidence, decision]
      properties:
        body_id: { type: integer }
        person_id: { type: integer }
        method: { type: string, enum: [appearance, weak_face, event_outfit] }
        confidence: { type: number }
        decision: { type: string, enum: [auto, suggest] }

    GroupingPlanResponse:
      type: object
      required: [mode, assignments, groups, duplicates, body_links, unsorted_face_ids]
      properties:
        mode: { type: string, enum: [apply, review] }
        assignments:
          type: array
          description: apply -> auto only; review -> auto and suggest
          items: { $ref: "#/components/schemas/FaceAssignment" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/FaceGroup" }
        duplicates:
          type: array
          items: { $ref: "#/components/schemas/DuplicatePeople" }
        body_links:
          type: array
          items: { $ref: "#/components/schemas/BodyLink" }
        unsorted_face_ids:
          type: array
          items: { type: integer }

    # ------------------------------------------------------------------ jobs
    JobType:
      type: string
      enum:
        - reface_image
        - reface_video
        - reface_image_reference
        - reface_video_reference
        - reface_image_v3
        - reface_image_v2
        - reface_image_dfm
        - reface_video_v3
        - reface_video_v2
        - reface_video_dfm
        - analyze_video
        - undress_image
        - edit_image
        - build_lora_dataset
        - train_lora
        - generate_lora_images
        - build_identity

    SourceFace:
      type: object
      description: One identity face. inswapper only consumes the embedding; quality/pose weight and angle-match it.
      required: [embedding, quality]
      properties:
        embedding: { $ref: "#/components/schemas/Embedding" }
        quality: { type: number }
        generated: { type: boolean, default: false, description: "Generated portraits have a bounded contribution when real identity faces are available." }
        pose:
          oneOf:
            - { $ref: "#/components/schemas/Pose" }
            - { type: "null" }

    NormalizedFaceRegion:
      type: object
      additionalProperties: false
      required: [x, y, w, h]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        w: { type: number, exclusiveMinimum: 0, maximum: 1 }
        h: { type: number, exclusiveMinimum: 0, maximum: 1 }

    ReferenceFrameRegions:
      type: object
      additionalProperties: false
      required: [frame, boxes]
      properties:
        frame: { type: integer, minimum: 0 }
        boxes:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/NormalizedFaceRegion" }

    TargetIdentity:
      type: object
      additionalProperties: false
      required: [model_id, embedding]
      properties:
        model_id: { type: string, enum: [buffalo_l@1, ccip-caformer24@1] }
        embedding:
          oneOf:
            - { $ref: "#/components/schemas/Embedding" }
            - { $ref: "#/components/schemas/CharacterEmbedding" }
      allOf:
        - if: { properties: { model_id: { const: ccip-caformer24@1 } } }
          then: { properties: { embedding: { $ref: "#/components/schemas/CharacterEmbedding" } } }
          else: { properties: { embedding: { $ref: "#/components/schemas/Embedding" } } }

    ReferenceRefaceParams:
      type: object
      additionalProperties: false
      description: Reference-image face-region replacement, not an embedding-space conversion. Source pixels are explicit; video identity locates only the selected target. Diffusion identity/temporal quality require separate acceptance.
      required: [source_kind, target_kind, experimental_acknowledged]
      properties:
        experimental_acknowledged: { type: boolean, const: true, description: Required explicit opt-in; current reference guidance failed identity-quality acceptance. }
        initialization: { type: string, enum: [target, source_pixels], default: target, description: Experimental source-pixel initialization also failed acceptance; it is not a certified alternative. }

        source_kind: { type: string, enum: [person, character] }
        target_kind: { type: string, enum: [person, character] }
        target_regions:
          type: array
          maxItems: 9000
          items: { $ref: "#/components/schemas/ReferenceFrameRegions" }
        target_identity: { $ref: "#/components/schemas/TargetIdentity" }
        seed: { type: integer, minimum: 0, maximum: 4294967295, default: 0 }
        steps: { type: integer, minimum: 5, maximum: 50, default: 20 }
        strength: { type: number, minimum: 0.1, maximum: 1, default: 0.75 }
        reference_scale: { type: number, minimum: 0, maximum: 1, default: 0.8 }
        start_time: { type: number, minimum: 0, maximum: 86400, default: 0 }
        end_time: { type: number, minimum: 0, maximum: 86400 }
      allOf:
        - if: { properties: { target_kind: { const: character } } }
          then: { properties: { target_identity: { properties: { model_id: { const: ccip-caformer24@1 } } } } }
          else: { properties: { target_identity: { properties: { model_id: { const: buffalo_l@1 } } } } }

    ActionPoseMember:
      type: object
      required: [points, mask, scale]
      properties:
        points: { type: array, minItems: 34, maxItems: 34, items: { type: number, minimum: -100, maximum: 100 } }
        mask: { type: integer, minimum: 0, maximum: 131071 }
        scale: { type: string, enum: [torso, shoulder, group] }

    ActionPoseFrame:
      type: object
      required: [time, members]
      properties:
        time: { type: integer, minimum: 0 }
        members: { type: array, minItems: 1, maxItems: 6, items: { $ref: "#/components/schemas/ActionPoseMember" } }

    ActionMatchRequest:
      type: object
      required: [kind, query, candidates]
      properties:
        kind: { type: string, enum: [photo, video] }
        allow_mirror: { type: boolean, default: false }
        query: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/ActionPoseFrame" } }
        candidates:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            required: [id, frames]
            properties:
              id: { type: string, minLength: 1, maxLength: 128 }
              frames: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/ActionPoseFrame" } }

    ActionMatchResponse:
      type: object
      required: [version, method, matches]
      properties:
        version: { type: integer, const: 1 }
        method: { type: string, const: pose_geometry_temporal_v1 }
        matches:
          type: array
          maxItems: 64
          items:
            type: object
            required: [id, score]
            properties:
              id: { type: string }
              score: { type: [number, "null"], minimum: 0, maximum: 1 }

    RefaceParams:
      type: object
      description: |
        Submit new work as reface_image or reface_video. Numbered and *_dfm job types are legacy aliases.
        Inputs: `target` (image or video blob).
        `target_faces` are matched to detections by IoU on the server (indices
        are not stable across runs). `dfm_model` selects a trained identity for unified
        jobs and is required for *_dfm aliases; then `source_faces` may be empty. Photo selections use boxes. All video engines
        support `target_embeddings` from the selected clip and nonempty
        `target_indices`. Omit selection to swap all faces. Empty selections
        are invalid. Preview videos render at most three seconds of the trim range.
        Legacy supports automatic/disabled enhancement and its occlusion option.
      properties:
        identity_bundle:
          type: object
          description: Reusable Multi-Photo Identity Profile (Phase 4). When provided, source_faces is optional.
        use_3d_geometry:
          type: boolean
          default: false
          description: Enable experimental pose-based visibility masking when engines.reface_geometry is available.
        quality_profile:
          type: string
          enum: [fast, balanced, detail]
          default: balanced
          description: Unified Reface only; configures one shared pipeline, not an engine version.
        source_faces:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SourceFace" }
        model_id: { type: string, default: "buffalo_l@1" }
        target_faces:
          type: array
          description: Boxes (pixels of the target image/first frame) to swap; omit for all faces
          items: { $ref: "#/components/schemas/BBox" }
        restorer: { type: string, default: auto, description: "Unified Reface auto uses the selected quality profile's available default; none disables restoration. Legacy aliases retain their defaults." }
        target_embeddings:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/Embedding" }
        target_indices:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 0, maximum: 31 }
        preview: { type: boolean, default: false }
        identity_boost: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        swapper: { type: string, enum: [auto, inswapper_128, hyperswap_1b_256, hyperswap_1c_256], default: auto }
        restorer_weight: { type: number, default: 0.5 }
        use_parser: { type: boolean, default: true }
        use_occluder: { type: boolean, default: true }
        realism_preset: { type: string, default: natural }
        realism_overrides: { type: [object, "null"], description: "Reserved; not accepted by P4." }
        dfm_model: { type: string }
        use_angle_matching: { type: boolean, default: true, description: "Reserved; not accepted by P4." }
        start_time: { type: number, default: 0 }
        end_time: { type: [number, "null"] }

    AnalyzeVideoParams:
      type: object
      description: "Inputs: `video` blob. Result: detections.ndjson, one AnalyzeImageResponse per sampled frame with frame_number and timestamp_ms; crops are inline base64. P3 uses progress polling (SSE arrives with P4)."
      properties:
        frame_interval: { type: number, default: 1.0, minimum: 0.25, maximum: 60 }
        sampling_mode:
          type: string
          enum: [fixed, adaptive]
          default: fixed
          description: Adaptive uses duration/480 seconds, bounded to 0.5–10 seconds; the actual grid is retained on resume.
        min_quality: { type: number, default: 0.40, minimum: 0, maximum: 1 }
        detect_bodies: { type: boolean, default: true }
        start_time: { type: number, default: 0, minimum: 0, maximum: 86400 }
        start_frame:
          type: integer
          default: 0
          minimum: 0
          description: First uncommitted frame; rounded up to the original frame_interval sampling grid.
        model_id: { type: [string, "null"] }
        return_outlines:
          type: boolean
          default: false
          description: "ask for face/body polygons; costs one parser pass per stored face and one RMBG pass per body"
        detect_characters: { type: boolean, default: false }
        faceless_characters:
          type: boolean
          default: true
          description: "With detect_characters: a body without a face, in a frame without real faces, is a character. False (a photo the user did not mark illustrated): only next to drawn faces."
        force_kind:
          type: [string, "null"]
          enum: [person, character, null]
          description: "The user's correction for the whole file: every detection is a person (drawn-face filter off) or a character."
        kind_overrides:
          type: array
          maxItems: 4096
          description: "The user's corrections of single detections; they win over force_kind."
          items: { $ref: "#/components/schemas/KindOverride" }

    UndressParams:
      type: object
      description: "Inputs: `image` blob, optional `refs` blobs. Mirrors undress_core.run_undress_job."
      properties:
        face_bbox:
          oneOf:
            - { $ref: "#/components/schemas/BBox" }
            - { type: "null" }
        prompt: { type: string }
        negative_prompt: { type: string }
        seed: { type: integer, default: -1 }
        steps: { type: integer, default: 26 }
        guidance_scale: { type: number, default: 6.0 }
        strength: { type: number, default: 0.6 }
        init_color:
          oneOf:
            - { type: array, minItems: 3, maxItems: 3, items: { type: integer, minimum: 0, maximum: 255 } }
            - { type: "null" }
        controlnet_scale: { type: number, default: 0.0 }
        ref_scale: { type: number, default: 0.85 }
        refine: { type: boolean, default: true }
        refine_strength: { type: number, default: 0.40 }
        refine_steps: { type: integer, default: 35 }

    BuildIdentityParams:
      type: object
      description: "Inputs: `images` blobs (up to 64). Result: identity_bundle.json containing multi-photo angle-aware representations, outlier exclusions and hash."
      properties:
        label: { type: string, maxLength: 128 }
        min_quality: { type: number, minimum: 0, maximum: 1, default: 0.25 }
        top_k: { type: integer, minimum: 1, maximum: 100, default: 20 }

    BuildLoraDatasetParams:
      type: object
      description: "Inputs: `images` blobs (photos or videos, up to 64). Result: dataset.zip containing one repeats_trigger person folder of images and captions. The model-aware anchor selects the chosen identity, including in group photos."
      required: [trigger_word, anchor_embedding]
      properties:
        trigger_word: { type: string }
        identity_model_id: { type: string, enum: [buffalo_l@1, ccip-caformer24@1], default: buffalo_l@1 }
        anchor_embedding:
          oneOf:
            - { $ref: "#/components/schemas/Embedding" }
            - { $ref: "#/components/schemas/CharacterEmbedding" }
        repeats: { type: integer, default: 20, minimum: 1, maximum: 100 }
        max_frames_per_video: { type: integer, default: 12, minimum: 1, maximum: 24 }
        enable_face_detailer: { type: boolean, default: true, description: "Restore each real face crop (GPEN) while building the dataset. Off keeps the crops as photographed. Not applied to drawn characters." }
        resolution_mode: { type: string, enum: ['512x768', '512x512'], description: "Accepted and ignored: older phone builds sent the training resolution with this job (it is a training setting, max_resolution)." }

      allOf:
        - if: { properties: { identity_model_id: { const: ccip-caformer24@1 } }, required: [identity_model_id] }
          then: { properties: { anchor_embedding: { $ref: "#/components/schemas/CharacterEmbedding" } } }
          else: { properties: { anchor_embedding: { $ref: "#/components/schemas/Embedding" } } }

    TrainLoraParams:
      type: object
      description: "Inputs: `dataset` blob (dataset.zip). Result: lora.safetensors. Only image/caption zip entries are accepted; training state is generated inside this job's scratch directory. Pausing resumes from the newest complete epoch checkpoint. person_id is deliberately absent."
      required: [trigger_word, base_checkpoint]
      properties:
        identity_model_id: { type: string, enum: [buffalo_l@1, ccip-caformer24@1], description: Explicit verified provenance; omitted for unknown legacy artifacts. }
        output_name: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        trigger_word: { type: string }
        base_checkpoint:
          type: string
          description: A name from capabilities.lora_base_checkpoints
        epochs: { type: integer, default: 10 }
        network_dim: { type: integer, default: 32 }
        network_alpha: { type: integer, default: 16 }
        learning_rate: { type: number, default: 0.0001 }
        batch_size: { type: integer, default: 1 }
        max_resolution: { type: integer, enum: [512, 768], default: 512 }

    GenerateLoraParams:
      type: object
      description: "Inputs: `lora` blob (.safetensors), optional `reference` blob."
      required: [trigger_word, num_images]
      properties:
        identity_model_id: { type: string, enum: [buffalo_l@1, ccip-caformer24@1], description: Explicit verified provenance; omitted for unknown legacy artifacts. }
        base_checkpoint: { type: string }
        trigger_word: { type: string }
        prompt: { type: string }
        negative_prompt: { type: string }
        angles:
          type: array
          minItems: 1
          maxItems: 16
          items: { type: string, enum: [frontal, three_quarter, profile, up, down] }
          description: "One head direction per image (then `num_images` must equal the list length): what the phone's Reface check found missing from the person's source faces. Portraits without a reference image only."
        num_images: { type: integer, minimum: 1, maximum: 16 }
        seed: { type: integer, default: -1 }
        steps: { type: integer, default: 30 }
        lora_scale: { type: number }
        guidance_scale: { type: number }
        multi_angle: { type: boolean, default: true }
        reference_mode: { type: string, enum: [composition, style, both] }
        reference_strength: { type: number, default: 0.6 }
        reference_scale: { type: number, default: 0.5 }
        generation_mode: { type: string, enum: [portrait, full_body], default: portrait }
        aspect_ratio: { type: string, enum: [square, vertical_768, tall_896], default: square }
        pose_media_id: { type: integer, nullable: true }
        enable_face_detailer: { type: boolean, default: true }
        pose_strength: { type: number, default: 1.0 }

    PhotoEditParams:
      type: object
      additionalProperties: false
      properties:
        operation: { type: string, enum: [remove, replace], default: replace }
        instruction: { type: string, maxLength: 600, default: "" }
        steps: { type: integer, minimum: 10, maximum: 40, default: 26 }
        seed: { type: integer, minimum: -1, maximum: 2147483647, default: -1 }
        mask_normalized: { type: boolean, default: false }
      description:  still-photo background/object edits. The PNG mask matches the EXIF-upright image; with mask_normalized, a preview-sized mask of the same aspect ratio is resized in normalized upright coordinates. Select at most 60 percent and avoid protected people. Pixels outside the selection are preserved.
      allOf:
        - if: { properties: { operation: { const: remove } }, required: [operation] }
          else:
            required: [instruction]
            properties:
              instruction: { minLength: 1 }

    JobCreate:
      type: object
      required: [type, params, inputs]
      properties:
        client_job_id:
          type: string
          description: Optional idempotency key; re-posting the same id returns the existing job
        type: { $ref: "#/components/schemas/JobType" }
        params: { type: object }
        inputs:
          type: object
          description: Blob slots -> sha256 (or an array of sha256 for `images` and `refs`)
          additionalProperties:
            oneOf:
              - { $ref: "#/components/schemas/Sha256" }
              - { type: array, items: { $ref: "#/components/schemas/Sha256" } }
      allOf:
        - if: { properties: { type: { const: edit_image } }, required: [type] }
          then:
            required: [client_job_id]
            properties:
              params: { $ref: "#/components/schemas/PhotoEditParams" }
              inputs:
                type: object
                additionalProperties: false
                required: [image, mask]
                properties:
                  image: { $ref: "#/components/schemas/Sha256" }
                  mask: { $ref: "#/components/schemas/Sha256" }
        - if: { properties: { type: { enum: [reface_image_reference, reface_video_reference] } }, required: [type] }
          then:
            properties:
              params: { $ref: "#/components/schemas/ReferenceRefaceParams" }
              inputs:
                type: object
                additionalProperties: false
                required: [target, source_reference]
                properties:
                  target: { $ref: "#/components/schemas/Sha256" }
                  source_reference: { $ref: "#/components/schemas/Sha256" }
        - if: { properties: { type: { const: reface_image_reference } }, required: [type] }
          then:
            properties:
              params:
                required: [target_regions]
                not: { required: [target_identity] }
                properties:
                  start_time: { const: 0 }
                  end_time: false
                  target_regions:
                    minItems: 1
                    maxItems: 1
                    items:
                      properties:
                        frame: { const: 0 }
                        boxes: { minItems: 1 }
        - if: { properties: { type: { const: reface_video_reference } }, required: [type] }
          then:
            properties:
              params:
                anyOf:
                  - required: [target_identity]
                  - required: [target_regions]
                    properties:
                      target_regions: { minItems: 1 }

        - if: { properties: { type: { enum: [reface_image, reface_video, reface_image_v3, reface_image_v2, reface_image_dfm, reface_video_v3, reface_video_v2, reface_video_dfm] } }, required: [type] }
          then:
            properties:
              params: { $ref: "#/components/schemas/RefaceParams" }
              inputs:
                type: object
                required: [target]
                additionalProperties: false
                properties:
                  target: { $ref: "#/components/schemas/Sha256" }
                  identity_bundle: { $ref: "#/components/schemas/Sha256" }
            anyOf:
              - properties:
                  params:
                    required: [source_faces]
                    properties:
                      source_faces: { minItems: 1 }
              - properties:
                  params: { required: [identity_bundle] }
              - properties:
                  inputs: { required: [identity_bundle] }
              - properties:
                  type: { enum: [reface_image, reface_video, reface_image_dfm, reface_video_dfm] }
                  params: { required: [dfm_model] }
            not:
              properties:
                params: { required: [identity_bundle] }
                inputs: { required: [identity_bundle] }
        - if: { properties: { type: { const: analyze_video } }, required: [type] }
          then:
            properties:
              params: { $ref: "#/components/schemas/AnalyzeVideoParams" }
              inputs: { required: [video] }
        - if: { properties: { type: { const: undress_image } }, required: [type] }
          then:
            properties:
              params: { $ref: "#/components/schemas/UndressParams" }
              inputs: { required: [image] }
        - if: { properties: { type: { const: build_identity } }, required: [type] }
          then:
            properties:
              params: { $ref: "#/components/schemas/BuildIdentityParams" }
              inputs: { required: [images] }
        - if: { properties: { type: { const: build_lora_dataset } }, required: [type] }
          then:
            properties:
              params: { $ref: "#/components/schemas/BuildLoraDatasetParams" }
              inputs: { required: [images] }
        - if: { properties: { type: { const: train_lora } }, required: [type] }
          then:
            properties:
              params: { $ref: "#/components/schemas/TrainLoraParams" }
              inputs: { required: [dataset] }
        - if: { properties: { type: { const: generate_lora_images } }, required: [type] }
          then:
            properties:
              params: { $ref: "#/components/schemas/GenerateLoraParams" }
              inputs: { required: [lora] }

    JobStatus:
      type: object
      description: Mirror of job_manager.Job
      required: [job_id, type, status, progress, message, queue_position, created_at]
      properties:
        job_id: { type: string }
        client_job_id: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/JobType" }
        status:
          type: string
          enum: [pending, queued, running, paused, completed, failed]
        progress: { type: number, minimum: 0, maximum: 1 }
        message: { type: string }
        queue_position: { type: integer }
        created_at: { type: string }
        started_at: { type: [string, "null"] }
        completed_at: { type: [string, "null"] }
        error: { type: [string, "null"] }
        last_frame: { type: integer }
        frames_done: { type: integer }
        incremental_results: { type: boolean, description: Verified frame batches can be imported while this video is running. }
        preview_jpeg:
          type: [string, "null"]
          contentEncoding: base64
          description: Latest sampled video frame, JPEG with longest side at most 480px; device-owned and ephemeral.
        preview_timestamp_ms: { type: [integer, "null"], minimum: 0 }
        details:
          type: object
          description: Engine-specific live state (LoRA stage/epoch/step/loss, generation seeds, ...)
          properties:
            stage: { type: string, description: "For video analysis: decode, inference or finalize." }
            total_samples: { type: integer, minimum: 0, description: Number of sampled positions in this video job, including unreadable samples. }
            skipped_frames: { type: integer, minimum: 0, description: Unreadable video samples skipped so far. }
            fps: { type: number, exclusiveMinimum: 0 }
            frame_interval: { type: number, exclusiveMinimum: 0, description: Actual spacing in seconds between sampled frames. }
          additionalProperties: true
        has_result: { type: boolean }

    VideoFrameBatch:
      type: object
      required: [ndjson, sha256, next_cursor, has_more, completed]
      properties:
        ndjson: { type: string, description: At most eight complete analysis records, normally at most 4 MiB; one large record may be up to 16 MiB. }
        sha256: { $ref: "#/components/schemas/Sha256" }
        next_cursor: { type: integer, minimum: 0 }
        has_more: { type: boolean }
        completed: { type: boolean, description: Analysis has completed and this batch drains all committed records. }

    ResultFile:
      type: object
      required: [name, size, sha256, mime]
      properties:
        name: { type: string }
        size: { type: integer }
        sha256: { $ref: "#/components/schemas/Sha256" }
        mime: { type: string }

    ResultManifest:
      type: object
      required: [job_id, files]
      properties:
        job_id: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/ResultFile" }
        meta:
          type: object
          additionalProperties: true
