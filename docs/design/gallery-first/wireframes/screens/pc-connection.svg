<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>PC connection — low-fidelity design</title><desc>Proposed wireframe. Full content, states and back behavior are documented in wireframe-atlas.md.</desc><style>text{font-family:Roboto,Arial,sans-serif}path,rect,circle{vector-effect:non-scaling-stroke}</style><rect x="0" y="0" width="390" height="844" rx="0" fill="#F7F6F2" stroke="none"/><text x="22" y="22" font-size="12" fill="#242823" font-weight="600" text-anchor="start">9:41</text><text x="365" y="22" font-size="12" fill="#62675F" font-weight="400" text-anchor="end">▰  ▴</text><text x="22" y="65" font-size="28" fill="#242823" font-weight="400" text-anchor="start">‹</text><text x="54" y="64" font-size="22" fill="#242823" font-weight="600" text-anchor="start">PC connection</text><text x="361" y="65" font-size="20" fill="#242823" font-weight="600" text-anchor="middle">···</text><text x="20" y="122" font-size="18" fill="#242823" font-weight="600" text-anchor="start">Saved connection</text><text x="20" y="156" font-size="14" fill="#62675F" font-weight="400" text-anchor="start">PC name and verified identity</text><text x="20" y="188" font-size="14" fill="#62675F" font-weight="400" text-anchor="start">Connected / Offline / Busy</text><text x="20" y="246" font-size="18" fill="#242823" font-weight="600" text-anchor="start">Pairing choices</text><text x="20" y="290" font-size="14" fill="#242823" font-weight="500" text-anchor="start">Scan QR code</text><text x="368" y="298" font-size="22" fill="#62675F" font-weight="400" text-anchor="end">›</text><path d="M20 328L370 328" fill="none" stroke="#DCDDD5" stroke-width="1"/><text x="20" y="354" font-size="14" fill="#242823" font-weight="500" text-anchor="start">Enter address manually</text><text x="368" y="362" font-size="22" fill="#62675F" font-weight="400" text-anchor="end">›</text><path d="M20 392L370 392" fill="none" stroke="#DCDDD5" stroke-width="1"/><text x="20" y="418" font-size="14" fill="#242823" font-weight="500" text-anchor="start">Find PCs on local network</text><text x="368" y="426" font-size="22" fill="#62675F" font-weight="400" text-anchor="end">›</text><path d="M20 456L370 456" fill="none" stroke="#DCDDD5" stroke-width="1"/><text x="20" y="498" font-size="18" fill="#242823" font-weight="600" text-anchor="start">Resource readiness</text><text x="20" y="542" font-size="14" fill="#242823" font-weight="500" text-anchor="start">Advertised engine readiness</text><text x="368" y="550" font-size="22" fill="#62675F" font-weight="400" text-anchor="end">›</text><path d="M20 580L370 580" fill="none" stroke="#DCDDD5" stroke-width="1"/><text x="20" y="606" font-size="14" fill="#242823" font-weight="500" text-anchor="start">Shared base checkpoints</text><text x="368" y="614" font-size="22" fill="#62675F" font-weight="400" text-anchor="end">›</text><path d="M20 644L370 644" fill="none" stroke="#DCDDD5" stroke-width="1"/><rect x="18" y="705" width="354" height="32" rx="0" fill="#F7F6F2" stroke="none"/><text x="20" y="726" font-size="12" fill="#62675F" font-weight="400" text-anchor="start">↓ Scroll for Resource readiness</text><rect x="20" y="756" width="350" height="52" rx="14" fill="#286653" stroke="none"/><text x="195" y="787" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Find or connect to PC</text><rect x="157" y="831" width="76" height="4" rx="2" fill="#242823" stroke="none"/><rect x="1" y="1" width="388" height="842" rx="20" fill="none" stroke="#8F958A"/></svg>