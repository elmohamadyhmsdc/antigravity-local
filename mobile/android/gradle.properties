org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# permission_handler_android is compiled against API 37, one above what AGP 9.0.1 has been tested with.
android.suppressUnsupportedCompileSdk=37

# The pub cache is on C: and this project on D:; Kotlin's incremental compilation cannot relate files across drives
# ("this and base files have different roots") and fails with "Could not close incremental caches".
kotlin.incremental=false
